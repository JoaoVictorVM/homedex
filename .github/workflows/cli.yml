name: CLI

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/cli.yml'
  pull_request:
    paths:
      - 'cli/**'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/cli.yml'

defaults:
  run:
    working-directory: cli

jobs:
  quality:
    name: Lint e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Verifica formatação
        run: |
          arquivos=$(gofmt -l .)
          if [ -n "$arquivos" ]; then
            echo "arquivos fora do padrão gofmt:"
            echo "$arquivos"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12
          working-directory: cli

      - name: Testes
        run: go test -race ./...

      - name: Build
        run: go build ./...

  cross-build:
    name: Build das plataformas da release
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    env:
      GOWORK: off
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Compila
        run: go build -o /dev/null ./cmd/homedex

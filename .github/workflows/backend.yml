name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/backend.yml'

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Lint e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verifica formatação
        run: |
          arquivos=$(gofmt -l .)
          if [ -n "$arquivos" ]; then
            echo "arquivos fora do padrão gofmt:"
            echo "$arquivos"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12
          working-directory: backend

      - name: Testes
        run: go test -race ./...

      - name: Build
        run: go build ./...

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
